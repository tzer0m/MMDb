name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stop service
        run: sudo systemctl stop MMDb.service
      - name: Publish
        run: dotnet publish MMDb/MMDb.csproj -c Release -o /home/tzer0m/Services/MMDb
      - name: Start service
        run: sudo systemctl start MMDb.service
      - name: Check status
        run: sudo systemctl status MMDb.service --no-pager
